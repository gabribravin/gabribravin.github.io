<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Resgate Enviada - Programa ARCA</title>
    <link rel="stylesheet" href="../../style.css">
    
    <style>
        /* Container Centralizado da Mensagem */
        .sucesso-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 4% 80px 4%;
            box-sizing: border-box;
        }

        /* Ícone Centralizado de Patinhas */
        .icone-patinhas-sucesso {
            font-size: 60px;
            margin-bottom: 25px;
        }

        /* Texto Descritivo */
        .texto-sucesso {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0 0 12px 0;
            max-width: 600px;
        }

        /* Protocolo em Destaque Laranja */
        .protocolo-destaque {
            color: #e2871e;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 40px;
        }

        /* Grid dos Dois Primeiros Botões Lado a Lado */
        .grid-botoes-superiores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 680px;
            margin-bottom: 16px;
        }

        /* Responsividade */
        @media (max-width: 680px) {
            .grid-botoes-superiores {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="navbar-placeholder"></div>

    <main class="sucesso-container">

        <div class="painel-conteudo-central" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
            
            <div class="icone-patinhas-sucesso">🐾</div>

            <h1 class="titulo-pagina-principal">Pedido de Resgate Enviado!</h1>
            <p class="texto-sucesso">Agradecemos o seu relato. Nossa equipe técnica analisará as fotos e a descrição para priorizar o atendimento conforme a gravidade e disponibilidade de vagas.</p>
            <div class="protocolo-destaque">Protocolo: #RES-2026-00912</div>

            <div class="grid-botoes-superiores">
                <button type="button" class="botao-acao-secundaria" id="btn-outro-resgate" style="max-width: 100%;">Solicitar outro resgate</button>
                <button type="button" class="botao-acao-secundaria" id="btn-acompanhar-painel" style="max-width: 100%;">Acompanhar no meu painel</button>
            </div>

            <button type="button" class="botao-acao-principal" id="btn-voltar-inicio" style="max-width: 300px;">Voltar ao início</button>

        </div>

    </main>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="footer-placeholder"></div>

    <script src="../../script.js"></script>
    <script>
        // Lógica para esconder o botão de painel caso o resgate seja anônimo
        const tipoResgate = sessionStorage.getItem('tipoResgate');
        const btnAcompanhar = document.getElementById('btn-acompanhar-painel');
        const gridBotoes = document.querySelector('.grid-botoes-superiores');

        if (tipoResgate === 'anonimo') {
            btnAcompanhar.style.display = 'none';
            gridBotoes.style.gridTemplateColumns = '1fr'; // Centraliza o botão de "Solicitar outro resgate"
        }

        document.getElementById('btn-outro-resgate').addEventListener('click', () => {
            window.location.href = 'solicitação-resgate.html';
        });
        document.getElementById('btn-acompanhar-painel').addEventListener('click', () => {
            window.location.href = '../Perfil/solicitacoes.html';
        });
        document.getElementById('btn-voltar-inicio').addEventListener('click', () => {
            window.location.href = '../../index.html';
        });
    </script>
</body>
</html>
