<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro ONG - Programa ARCA</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .cadastro-wrapper { max-width: 750px; margin: 0 auto; }
        .tipo-usuario-selector { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; }
        .radio-box { border: 2px solid #cbd5e1; padding: 15px 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 600; color: #4a5568; transition: all 0.2s; }
        .radio-box input { cursor: pointer; }
        .radio-box.active { border-color: var(--verde-institucional); background-color: #f0f7fd; color: var(--verde-institucional); }
        .pet-section-box { background-color: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 25px; margin: 25px 0; }
        @media (max-width: 600px) { .tipo-usuario-selector { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main class="container-arca-padrao">
        <div class="cadastro-wrapper">
            <div class="btn-voltar-container">
                <a href="javascript:history.back()" class="botao-voltar-estilizado">Voltar</a>
            </div>
            <div class="painel-conteudo-central">
                <h2 class="titulo-pagina-principal" style="text-align: center;">Criar Conta no Programa ARCA</h2>
                <div class="tipo-usuario-selector">
                    <label class="radio-box" id="label-cidadao">
                        <input type="radio" name="tipo_perfil" value="cidadao" onchange="window.location.href='cadastro.html'">
                        Sou Cidadão
                    </label>
                    <label class="radio-box active" id="label-ong">
                        <input type="radio" name="tipo_perfil" value="ong" checked>
                        Sou uma ONG
                    </label>
                </div>
                <form novalidate>
                    <div class="form-grid-padrao">
                        <div class="campo-largura-cheia">
                            <label class="rotulo-campo-formulario">Nome da ONG / Instituição</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Razão Social ou Nome Fantasia" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">CNPJ</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="00.000.000/0001-00" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Telefone</label>
                            <input type="tel" class="campo-texto-estilizado" placeholder="(27) 3333-3333" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">CEP</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="00000-000" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Bairro</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Ex: Laranjeiras" required>
                        </div>
                        <div class="campo-largura-cheia">
                            <label class="rotulo-campo-formulario">Endereço da Sede</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Rua e Número" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">E-mail</label>
                            <input type="email" class="campo-texto-estilizado" placeholder="ong@email.com" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Confirme seu E-mail</label>
                            <input type="email" class="campo-texto-estilizado" placeholder="Repita o e-mail" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Senha</label>
                            <input type="password" class="campo-texto-estilizado" placeholder="Crie uma senha" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Confirme sua Senha</label>
                            <input type="password" class="campo-texto-estilizado" placeholder="Repita a senha" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 20px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600;">
                            <input type="checkbox" id="possui-animais" onchange="document.getElementById('pet-section-box').style.display = this.checked ? 'block' : 'none'" style="width: 18px; height: 18px;">
                            Possuo animais e desejo cadastrá-los agora
                        </label>
                    </div>

                    <div class="pet-section-box" id="pet-section-box" style="display: none;">
                        <h3 style="margin-bottom: 20px; color: var(--verde-navbar);">Animais para Adoção</h3>
                        <div id="lista-animais-container">
                            <div class="pet-item" style="border-bottom: 2px solid #e2e8f0; margin-bottom: 25px; padding-bottom: 20px;">
                                <div class="form-grid-padrao">
                                    <div class="form-group">
                                        <label class="rotulo-campo-formulario">Nome do Animal</label>
                                        <input type="text" class="campo-texto-estilizado" placeholder="Nome do pet">
                                    </div>
                                    <div class="form-group">
                                        <label class="rotulo-campo-formulario">Espécie</label>
                                        <select class="campo-texto-estilizado"><option value="cachorro">Cachorro</option><option value="gato">Gato</option></select>
                                    </div>
                                    <div class="form-group">
                                        <label class="rotulo-campo-formulario">Sexo</label>
                                        <select class="campo-texto-estilizado"><option value="macho">Macho</option><option value="femea">Fêmea</option></select>
                                    </div>
                                    <div class="form-group">
                                        <label class="rotulo-campo-formulario">Idade Estimada</label>
                                        <select class="campo-texto-estilizado">
                                            <option value="menos_3m">Menos de 3 meses</option>
                                            <option value="3m_5m">De 03 meses a 05 meses</option>
                                            <option value="6m_7a">06 meses a 07 anos</option>
                                            <option value="acima_7a">Acima de 07 anos</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="rotulo-campo-formulario">Porte</label>
                                        <select class="campo-texto-estilizado">
                                            <option value="minusculo">Minúsculo</option>
                                            <option value="pequeno">Pequeno</option>
                                            <option value="medio">Médio</option>
                                            <option value="grande">Grande</option>
                                            <option value="gigante">Gigante</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="rotulo-campo-formulario">Peso</label>
                                        <select class="campo-texto-estilizado">
                                            <option value="ate_5kg">Até 5kg</option>
                                            <option value="6_15kg">De 06 a 15kg</option>
                                            <option value="acima_15kg">Acima de 15kg</option>
                                        </select>
                                    </div>
                                    <div class="form-group campo-largura-cheia">
                                        <label class="rotulo-campo-formulario">Comportamento</label>
                                        <select class="campo-texto-estilizado">
                                            <option value="docil">Dócil e sociável</option>
                                            <option value="agressivo">Protetor / Bravo</option>
                                            <option value="assustado">Muito medroso / Arisco</option>
                                            <option value="agitado">Hiperativo / Muita energia</option>
                                        </select>
                                    </div>
                                    <div class="form-group campo-largura-cheia">
                                        <label class="rotulo-campo-formulario">Já fez algum tipo de cirurgia?</label>
                                        <select class="campo-texto-estilizado" onchange="const box = this.closest('.pet-item').querySelector('.qual-cirurgia-box'); box.style.display = this.value === 'sim' ? 'block' : 'none'">
                                            <option value="nao">Não</option>
                                            <option value="sim">Sim</option>
                                        </select>
                                    </div>
                                    <div class="form-group campo-largura-cheia qual-cirurgia-box" style="display: none;">
                                        <label class="rotulo-campo-formulario">Qual cirurgia?</label>
                                        <input type="text" class="campo-texto-estilizado" placeholder="Descreva as cirurgias">
                                    </div>
                                    <div class="form-group campo-largura-cheia">
                                        <label class="rotulo-campo-formulario">Informações Adicionais</label>
                                        <textarea rows="2" class="campo-texto-estilizado" placeholder="Saúde, comportamento..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" onclick="adicionarNovoPet()" class="botao-acao-secundaria" style="max-width: 250px; font-size: 13px;">+ Outro Animal</button>
                    </div>

                    <div class="termo-guarda-box" style="margin-top: 30px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" id="chk-serra" required style="width: 18px; height: 18px;">
                            Confirmo que a ONG atua na Serra - ES.
                        </label>
                    </div>

                    <div style="display: flex; justify-content: center; margin-top: 30px;">
                        <button type="submit" class="botao-acao-principal" style="width: 100%; max-width: 400px;">Concluir Cadastro</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../../script.js"></script>
    <script>
        function adicionarNovoPet() {
            const container = document.getElementById('lista-animais-container');
            const novo = container.querySelector('.pet-item').cloneNode(true);
            novo.querySelectorAll('input, textarea').forEach(el => el.value = '');
            novo.querySelector('.qual-cirurgia-box').style.display = 'none';
            container.appendChild(novo);
        }
    </script>
</body>
</html>
