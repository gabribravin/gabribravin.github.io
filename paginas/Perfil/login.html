<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Programa ARCA</title>
    <link rel="stylesheet" href="../../style.css">

    <style>
        .login-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .login-card {
            background-color: var(--fundo-card);
            border: 1px solid var(--borda-card);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 1px 1px 5px rgba(17, 63, 60, 0.15);
            text-align: center;
            max-width: 450px;
            margin: 15px auto 0 auto;
        }

        .login-card h2 {
            color: #0d3c35;
            font-size: 1.6rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .cadastro-alternativo {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #718096;
        }

        .cadastro-alternativo a {
            color: #0d3c35;
            font-weight: 700;
            text-decoration: none;
        }

        .login-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
            margin-bottom: 30px;
            text-align: left;
        }
        .login-links a {
            color: var(--verde-navbar);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="login-container">
        <a href="javascript:history.back()" class="botao-voltar-estilizado">Voltar</a>
        <div style="clear: both;"></div>

        <div class="login-card">
            <h2>Entrar no Programa ARCA</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="usuario" class="rotulo-campo-formulario">Nome de usuário</label>
                    <input type="text" id="usuario" class="campo-texto-estilizado" placeholder="Digite seu nome de usuário" required>
                </div>
                
                <div class="form-group">
                    <label for="senha" class="rotulo-campo-formulario">Senha</label>
                    <input type="password" id="senha" class="campo-texto-estilizado" placeholder="Digite sua senha" required>
                </div>

                <div class="login-links">
                    <a href="#">Esqueceu a senha?</a>
                    <label style="color: #718096; cursor: pointer;"><input type="checkbox"> Lembrar-me</label>
                </div>

                <button type="submit" class="botao-acao-principal">Entrar</button>
            </form>

            <p class="cadastro-alternativo">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
            </p>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../../script.js"></script>
</body>
</html>
