<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Novo Pet - Programa ARCA</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="navbar-placeholder"></div>

    <main class="container-arca-padrao">
        <div class="wrapper-conteudo-central">
            <div class="btn-voltar-container">
                <a href="javascript:history.back()" class="botao-voltar-estilizado">Voltar</a>
            </div>
            
            <h1 class="titulo-secao-padrao">Adicionar novo pet</h1>
            <div class="painel-conteudo-central">
                <form id="form-adicionar-pet" class="form-grid-padrao" novalidate>
                    <div class="form-group campo-largura-cheia">
                        <label class="rotulo-campo-formulario" for="nome-pet">Nome do Animal</label>
                        <input type="text" id="nome-pet" class="campo-texto-estilizado" placeholder="Nome do pet" required>
                    </div>

                    <div class="form-group">
                        <label class="rotulo-campo-formulario">Espécie</label>
                        <select id="especie-pet" class="campo-texto-estilizado" required>
                            <option value="">Selecionar opção</option>
                            <option value="cachorro">Cachorro</option>
                            <option value="gato">Gato</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="rotulo-campo-formulario">Sexo</label>
                        <select id="sexo-pet" class="campo-texto-estilizado" required>
                            <option value="">Selecionar opção</option>
                            <option value="macho">Macho</option>
                            <option value="femea">Fêmea</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="rotulo-campo-formulario">Idade Estimada</label>
                        <select id="idade-pet" class="campo-texto-estilizado" required>
                            <option value="">Selecionar opção</option>
                            <option value="menos_3m">Menos de 3 meses</option>
                            <option value="3m_5m">De 03 meses a 05 meses</option>
                            <option value="6m_7a">06 meses a 07 anos</option>
                            <option value="acima_7a">Acima de 07 anos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="rotulo-campo-formulario">Porte</label>
                        <select id="porte-pet" class="campo-texto-estilizado" required>
                            <option value="">Selecionar opção</option>
                            <option value="minusculo">Minúsculo</option>
                            <option value="pequeno">Pequeno</option>
                            <option value="medio">Médio</option>
                            <option value="grande">Grande</option>
                            <option value="gigante">Gigante</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="rotulo-campo-formulario">Peso</label>
                        <select id="peso-pet" class="campo-texto-estilizado" required>
                            <option value="">Selecionar opção</option>
                            <option value="ate_5kg">Até 5kg</option>
                            <option value="6_15kg">De 06 a 15kg</option>
                            <option value="acima_15kg">Acima de 15kg</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="rotulo-campo-formulario">Comportamento</label>
                        <select id="comportamento-pet" class="campo-texto-estilizado" required>
                            <option value="">Selecionar opção</option>
                            <option value="docil">Dócil e sociável</option>
                            <option value="agressivo">Protetor / Bravo com estranhos</option>
                            <option value="assustado">Muito medroso / Arisco</option>
                            <option value="agitado">Hiperativo / Muita energia</option>
                        </select>
                    </div>

                    <div class="form-group campo-largura-cheia">
                        <label class="rotulo-campo-formulario">Já fez algum tipo de cirurgia?</label>
                        <select id="cirurgia-pet" class="campo-texto-estilizado" onchange="verificarCirurgia(this)" required>
                            <option value="nao">Não</option>
                            <option value="sim">Sim</option>
                        </select>
                    </div>

                    <div id="qual-cirurgia-box" class="form-group campo-largura-cheia" style="display: none;">
                        <label class="rotulo-campo-formulario">Caso tenha feito, qual cirurgia?</label>
                        <input type="text" id="desc-cirurgia" class="campo-texto-estilizado" placeholder="Descreva as cirurgias anteriores">
                    </div>

                    <div class="form-group campo-largura-cheia">
                        <label class="rotulo-campo-formulario">Informações Adicionais</label>
                        <textarea id="info-pet" class="campo-texto-estilizado" rows="3" placeholder="Algum detalhe importante..."></textarea>
                    </div>

                    <div class="campo-largura-cheia" style="display: flex; justify-content: center; margin-top: 20px;">
                        <button type="submit" class="botao-acao-principal" id="btn-cadastrar-pet" style="max-width: 320px;">
                            Salvar animal no perfil
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="footer-placeholder"></div>

    <script src="../../script.js"></script>
    <script>
        function verificarCirurgia(select) {
            const box = document.getElementById('qual-cirurgia-box');
            box.style.display = select.value === 'sim' ? 'flex' : 'none';
        }

        document.getElementById('form-adicionar-pet').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = "solicitacoes.html";
        });
    </script>
</body>
</html>
