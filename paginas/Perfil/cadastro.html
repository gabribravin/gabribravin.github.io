<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Programa ARCA</title>
    <link rel="stylesheet" href="../../style.css">

    <style>
        .cadastro-wrapper {
            max-width: 750px;
            margin: 0 auto;
        }

        /* Seletor de Tipo de Perfil (Ong ou Cidadão) */
        .tipo-usuario-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
       }

        .radio-box {
            border: 2px solid #cbd5e1;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s;
        }

        .radio-box input {
            cursor: pointer;
        }

        .radio-box.active {
            border-color: #0d3c35;
            background-color: #f0f7fd;
            color: #0d3c35;
        }

        /* Inputs e Formulários */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* Seção do Pet */
        .pet-section-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 25px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .pet-section-box h3 {
            color: #3b7a6f;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        /* Estilo idêntico ao Termo de Guarda do formulário de adoção */
        .termo-guarda-box {
            margin: 40px 0;
            font-size: 14px;
            color: var(--texto-escuro);
        }
        .termo-titulo {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--texto-mutado);
        }
        .opcao-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: var(--texto-escuro);
            cursor: pointer;
            font-weight: 500;
        }

        /* Responsividade para Telas Menores */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .tipo-usuario-selector {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="navbar-placeholder"></div>

    <!-- CONTEÚDO DE CADASTRO -->
    <main class="container-arca-padrao">
        <div class="cadastro-wrapper">
            <a href="javascript:history.back()" class="botao-voltar-estilizado">Voltar</a>
            <div style="clear: both;"></div>

            <div class="painel-conteudo-central">
            <h2 class="titulo-pagina-principal" style="text-align: center;">Criar Conta no Programa ARCA</h2>

            <!-- Pergunta se é ONG ou Cidadão -->
            <div class="tipo-usuario-selector">
                <label class="radio-box active" id="label-cidadao">
                    <input type="radio" name="tipo_perfil" value="cidadao" checked onchange="mudarPerfil('cidadao')">
                    Sou Cidadão
                </label>
                <label class="radio-box" id="label-ong">
                    <input type="radio" name="tipo_perfil" value="ong" onchange="mudarPerfil('ong')">
                    Sou uma ONG
                </label>
            </div>

            <form>
                <!-- DADOS DO USUÁRIO (Muda dinamicamente via JS abaixo) -->
                <div class="painel-informativo-padrao">
                    <div class="form-grid" id="campos-usuario">
                        <!-- Os campos padrão do Cidadão começam aqui -->
                        <div class="full-width">
                            <label class="rotulo-campo-formulario" id="lbl-nome">Nome Completo</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Digite seu nome" required>
                        </div>
                        <div id="container-cpf">
                            <label class="rotulo-campo-formulario">CPF</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="000.000.000-00">
                        </div>
                        <div id="container-cnpj" style="display: none;">
                            <label class="rotulo-campo-formulario">CNPJ</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="00.00.000.000/0001-00">
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Telefone</label>
                            <input type="tel" class="campo-texto-estilizado" placeholder="(27) 99999-9999" required>
                        </div>
                        
                        <!-- Endereço comum a ambos -->
                        <div>
                            <label class="rotulo-campo-formulario">CEP</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Ex: 00000-000" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Bairro</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Ex: Laranjeiras" required>
                        </div>
                        <div class="full-width">
                            <label class="rotulo-campo-formulario">Rua e Número</label>
                            <input type="text" class="campo-texto-estilizado" placeholder="Av. Principal, nº 123" required>
                        </div>

                        <!-- Credenciais com dupla validação (Email e Senha) -->
                        <div>
                            <label class="rotulo-campo-formulario">E-mail</label>
                            <input type="email" class="campo-texto-estilizado" placeholder="seu@email.com" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Confirme seu E-mail</label>
                            <input type="email" class="campo-texto-estilizado" placeholder="Repita o e-mail" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Senha</label>
                            <input type="password" class="campo-texto-estilizado" placeholder="Crie uma senha" required>
                        </div>
                        <div>
                            <label class="rotulo-campo-formulario">Confirme sua Senha</label>
                            <input type="password" class="campo-texto-estilizado" placeholder="Repita a senha" required>
                        </div>
                    </div>
                </div>

                <!-- Pergunta se tem animais -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; color: #4a5568;">
                        <input type="checkbox" id="possui-animais" onchange="togglePetSection(this.checked)" style="width: 18px; height: 18px;">
                        Possuo animais e desejo cadastrá-los agora
                    </label>
                </div>

                <!-- SEÇÃO ADICIONAR ANIMAL -->
                <div class="pet-section-box" id="pet-section-box" style="display: none;">
                    <h3 id="pet-box-titulo">Meus Animais</h3>
                    <div id="lista-animais-container">
                        <!-- Bloco Repetível do Animal -->
                        <div class="pet-item" style="border-bottom: 2px solid #e2e8f0; margin-bottom: 30px; padding-bottom: 20px;">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Nome do Animal</label>
                                    <input type="text" placeholder="Nome do pet">
                                </div>
                                <div class="form-group">
                                    <label>Espécie</label>
                                    <select>
                                        <option value="cachorro">Cachorro</option>
                                        <option value="gato">Gato</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Sexo</label>
                                    <select>
                                        <option value="macho">Macho</option>
                                        <option value="femea">Fêmea</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Idade Estimada</label>
                                    <select>
                                        <option value="menos_3m">Menos de 3 meses</option>
                                        <option value="3m_5m">De 03 meses a 05 meses</option>
                                        <option value="6m_7a">06 meses a 07 anos</option>
                                        <option value="acima_7a">Acima de 07 anos</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Porte</label>
                                    <select>
                                        <option value="minusculo">Minúsculo</option>
                                        <option value="pequeno">Pequeno</option>
                                        <option value="medio">Médio</option>
                                        <option value="grande">Grande</option>
                                        <option value="gigante">Gigante</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Peso</label>
                                    <select>
                                        <option value="ate_5kg">Até 5kg</option>
                                        <option value="6_15kg">De 06 a 15kg</option>
                                        <option value="acima_15kg">Acima de 15kg</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Comportamento do Animal</label>
                                    <select>
                                        <option value="docil">Dócil e sociável</option>
                                        <option value="agressivo">Protetor / Bravo com estranhos</option>
                                        <option value="assustado">Muito medroso / Arisco</option>
                                        <option value="agitado">Hiperativo / Muita energia</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Já fez algum tipo de cirurgia?</label>
                                    <select onchange="verificarCirurgia(this)">
                                        <option value="nao">Não</option>
                                        <option value="sim">Sim</option>
                                    </select>
                                </div>
                                <div class="form-group full-width qual-cirurgia-box" style="display: none;">
                                    <label>Caso tenha feito, qual cirurgia?</label>
                                    <input type="text" placeholder="Descreva as cirurgias anteriores">
                                </div>
                                <div class="form-group full-width">
                                    <label>Informações Adicionais</label>
                                    <textarea rows="3" placeholder="Algum detalhe importante sobre a saúde ou história do animal..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" onclick="adicionarNovoPet()" class="botao-acao-secundaria" style="max-width: 280px; font-size: 14px; padding: 10px;">+ Adicionar Outro Animal</button>
                </div>

                <!-- Caixa de confirmação de residência na Serra -->
                <div class="termo-guarda-box">
                    <div class="termo-titulo">Compromisso de Residência</div>
                    <p style="margin-bottom: 15px; color: #333;">Para utilizar os serviços do Programa ARCA, é necessário residir no município.</p>
                    <label class="opcao-checkbox-label">
                        <input type="checkbox" id="chk-serra" required style="width: 18px; height: 18px; accent-color: var(--amarelo-primario);"> 
                        Li e confirmo que resido ou possuo atividade ativa na Serra - ES.
                    </label>
                </div>

                <div style="display: flex; justify-content: center; margin-top: 30px;">
                    <button type="submit" class="botao-acao-principal botao-estado-bloqueado" id="btn-concluir-cadastro" style="max-width: 100%; width: 400px;">Concluir Cadastro</button>
                </div>
            </form>
        </div>
        </div>
    </main>

    <!-- INTERAÇÃO DINÂMICA VIA JAVASCRIPT -->
    <script>
        // Controle do botão de cadastro baseado no aceite do termo
        document.addEventListener('DOMContentLoaded', () => {
            const btnCadastrar = document.getElementById('btn-concluir-cadastro');
            const chkSerra = document.getElementById('chk-serra');
            
            chkSerra.addEventListener('change', function() {
                if (this.checked) btnCadastrar.classList.remove('botao-estado-bloqueado');
                else btnCadastrar.classList.add('botao-estado-bloqueado');
            });
        });

        function mudarPerfil(tipo) {
            const labelCidadao = document.getElementById('label-cidadao');
            const labelOng = document.getElementById('label-ong');
            const containerCnpj = document.getElementById('container-cnpj');
            const containerCpf = document.getElementById('container-cpf');
            const lblNome = document.getElementById('lbl-nome');
            const petBoxTitulo = document.getElementById('pet-box-titulo');

            if (tipo === 'ong') {
                labelOng.classList.add('active');
                labelCidadao.classList.remove('active');
                containerCnpj.style.display = 'flex';
                containerCpf.style.display = 'none';
                lblNome.innerText = 'Nome da ONG / Instituição';
                petBoxTitulo.innerText = 'Animais para Acolhimento';
            } else {
                labelCidadao.classList.add('active');
                labelOng.classList.remove('active');
                containerCnpj.style.display = 'none';
                containerCpf.style.display = 'flex';
                lblNome.innerText = 'Nome Completo';
                petBoxTitulo.innerText = 'Meus Animais';
            }
        }

        function togglePetSection(checked) {
            const petBox = document.getElementById('pet-section-box');
            petBox.style.display = checked ? 'block' : 'none';
        }

        function verificarCirurgia(selectElement) {
            const petItem = selectElement.closest('.pet-item');
            const boxQual = petItem.querySelector('.qual-cirurgia-box');
            if (selectElement.value === 'sim') {
                boxQual.style.display = 'flex';
            } else {
                boxQual.style.display = 'none';
            }
        }

        function adicionarNovoPet() {
            const container = document.getElementById('lista-animais-container');
            const primeiroPet = container.querySelector('.pet-item');
            const novoPet = primeiroPet.cloneNode(true);
            
            novoPet.querySelectorAll('input, textarea').forEach(el => el.value = '');
            novoPet.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
            novoPet.querySelector('.qual-cirurgia-box').style.display = 'none';
            
            container.appendChild(novoPet);
        }
    </script>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="footer-placeholder"></div>

    <script src="../../script.js"></script>
</body>
</html>
