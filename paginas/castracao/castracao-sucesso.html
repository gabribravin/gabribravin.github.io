<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Confirmado - Programa ARCA</title>
    <link rel="stylesheet" href="../../style.css">
    
    <style>
        /* Container Centralizado da Mensagem */
        .sucesso-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 4% 80px 4%;
            box-sizing: border-box;
        }

        /* Ícone Centralizado de Patinhas */
        .icone-patinhas-sucesso {
            font-size: 60px;
            margin-bottom: 25px;
        }

        /* Texto Descritivo */
        .texto-sucesso {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0 0 12px 0;
            max-width: 600px;
        }

        /* Protocolo em Destaque Laranja */
        .protocolo-destaque {
            color: #e2871e;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 40px;
        }

        /* Grid dos Dois Primeiros Botões Lado a Lado */
        .grid-botoes-superiores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 680px;
            margin-bottom: 16px;
        }

        /* Responsividade */
        @media (max-width: 680px) {
            .grid-botoes-superiores {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="navbar-placeholder"></div>

    <main class="sucesso-container">
        <div class="painel-conteudo-central" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
            <div class="icone-patinhas-sucesso">🏥</div>
            <h1 class="titulo-pagina-principal">Agendamento Realizado!</h1>
            <p class="texto-sucesso">Sua solicitação foi enviada para a clínica escolhida. Lembre-se que o animal deve estar em <strong>jejum total de 8 horas</strong> (água e comida) antes do procedimento.</p>
            <div class="protocolo-destaque">Protocolo: #CAST-2026-00415</div>
            <div class="grid-botoes-superiores">
                <a href="selecionar-pet.html" class="botao-acao-secundaria" style="max-width: 100%;">Agendar outro animal</a>
                <a href="../Perfil/solicitacoes.html" class="botao-acao-secundaria" style="max-width: 100%;">Ver no meu painel</a>
            </div>
            <a href="../../index.html" class="botao-acao-principal" style="max-width: 300px;">Voltar ao início</a>
        </div>
    </main>

    <!-- Injetado automaticamente pelo script.js -->
    <div id="footer-placeholder"></div>

    <script src="../../script.js"></script>
</body>
</html>
